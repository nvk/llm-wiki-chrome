[project]
name = "llm-wiki-adapter-browser-execution"
version = "0.0.1"
requires-python = ">=3.9"
description = "Private exact-target typed browser executor for targeted llm-wiki adapters"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["browser_executor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
